# Relative directories resolve against the repository root.
paths:
  data: data
  outputs: outputs

jpl_cad:
  endpoint: https://ssd-api.jpl.nasa.gov/cad.api
  expected_version: "1.5"
  query:
    date-min: now
    date-max: "+30"
    dist-max: "0.05"
    body: Earth
    neo: "true"
    sort: dist
    diameter: "true"
    fullname: "true"

pipeline:
  raw_json: cad_close_approaches.json
  processed_csv: cad_close_approaches.csv
  summary_json: summary.json
