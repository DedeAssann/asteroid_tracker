[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-tracker"
version = "0.1.0"
description = "Portable scientific Python pipeline for NASA/JPL near-Earth-object close-approach data"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1,<7",
  "requests>=2.32,<3",
  "pandas>=2.2,<3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
